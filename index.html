<!doctype html>
<html lang="en">

  <body class="bg-[#faf8f5] text-slate-900 antialiased">
    <div id="root"></div>

    <!-- Universal Loader: Runs directly on Live Server (port 5500) and Vite (port 5173) -->
    <script>
      (function() {
        var isVite = window.location.port === '5173';
        var script = document.createElement('script');
        script.type = 'module';
        script.src = isVite ? '/src/main.jsx' : './assets/app.js';
        document.body.appendChild(script);
      })();
    </script>
  </body>
